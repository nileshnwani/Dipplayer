<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080807">
<title>Happy Birthday Dipali</title>
<style>
:root{color-scheme:dark;--bg:#080807;--panel:#11110f;--text:#f7f5ef;--muted:#aaa9a2;--gold:#d7b56d;--line:#34332f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 28%,#171611 0%,var(--bg) 58%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;
     background-image: url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?ixlib=rb-4.0.3&auto=format&fit=crop&w=1567&q=80');
     background-size: cover;
     background-position: center;
     background-attachment: fixed;
     background-blend-mode: overlay;
     }
button,input{font:inherit}
button{cursor:pointer}
.app{width:min(100%,520px);min-height:100svh;margin:auto;padding:22px 24px 30px;display:flex;flex-direction:column;
     background: rgba(8, 8, 7, 0.85);
     backdrop-filter: blur(5px);
    }
.topbar{display:flex;justify-content:space-between;align-items:center;height:42px}
.icon-button{background:transparent;border:0;color:var(--text);padding:8px;display:grid;place-items:center;border-radius:50%}
.icon-button:hover{background:#ffffff12}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu{position:relative}.menu-pop{display:none;position:absolute;right:0;top:42px;background:#1a1916;border:1px solid #38362e;border-radius:12px;padding:7px;min-width:180px;z-index:5}
.menu-pop.open{display:block}.menu-pop button{display:block;width:100%;border:0;background:transparent;color:white;text-align:left;padding:10px;border-radius:8px}.menu-pop button:hover{background:#ffffff12}
.art-wrap{margin:clamp(42px,10vh,100px) auto 0;width:min(72vw,300px);aspect-ratio:1;position:relative}
.art{width:100%;height:100%;border:1.5px solid #f4f1e8;border-radius:28%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0b0b09; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
.art img{width:100%;height:100%;object-fit:cover;display:none}.art img.visible{display:block}
.art .placeholder{width:58%;height:58%;color:#f6f3ea}
.birthday-tag{margin:28px 0 0;text-align:center;display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);font-size:12px;letter-spacing:.32em;text-transform:uppercase; text-shadow: 1px 1px 2px black;}
.birthday-tag:before,.birthday-tag:after{content:"";width:30px;height:1px;background:var(--gold)}
.song-title{text-align:center;font-size:clamp(25px,6vw,34px);font-weight:450;letter-spacing:-.035em;margin:17px 0 5px;line-height:1.2;overflow-wrap:anywhere; text-shadow: 1px 1px 3px black;}
.song-subtitle{text-align:center;color:var(--muted);font-size:17px;margin:0;overflow-wrap:anywhere; text-shadow: 1px 1px 2px black;}
.track-actions{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:54px}
.track-actions .icon-button svg{width:25px;height:25px}.active{color:var(--gold)!important}
.progress-area{margin-top:26px}
.progress{appearance:none;width:100%;height:4px;border-radius:9px;background:linear-gradient(to right,#f7f5ef var(--progress,0%),#565550 var(--progress,0%));display:block;cursor:pointer}
.progress::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;border:0; box-shadow: 0 0 5px rgba(0,0,0,0.5);}
.progress::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:0; box-shadow: 0 0 5px rgba(0,0,0,0.5);}
.times{display:flex;justify-content:space-between;color:#e8e6df;font-size:12px;margin-top:10px; font-weight: bold;}
.controls{display:flex;align-items:center;justify-content:space-between;margin-top:34px;gap:8px}
.controls .icon-button svg{width:22px;height:22px; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5));}
.controls .main-play{width:66px;height:66px;border-radius:50%;background:#f8f7f2;color:#090908;border:0;display:grid;place-items:center;flex:none; box-shadow: 0 4px 10px rgba(0,0,0,0.5);}
.main-play svg{width:25px;height:25px;stroke-width:2.5}.controls .icon-button{padding:10px}
.queue{margin-top:26px;border-top:1px solid #3a3832;padding-top:16px}
.queue-head{display:flex;justify-content:space-between;align-items:center;color:#d8d4c8;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px; font-weight: bold;}
.track-list{display:grid;gap:7px}
.track-item{display:flex;align-items:center;gap:10px;border:1px solid transparent;border-radius:12px;padding:8px;background:rgba(255,255,255,0.08);min-width:0; backdrop-filter: blur(2px);}
.track-item.current{border-color:var(--gold);background:rgba(215, 181, 109, 0.15)}
.thumb{width:43px;height:43px;border-radius:8px;object-fit:cover;background:#24231f;flex:none}
.track-meta{min-width:0;flex:1}.track-meta strong,.track-meta span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track-meta strong{font-size:13px;font-weight:600; text-shadow: 1px 1px 2px black;}.track-meta span{font-size:11px;color:#d1cfc7;margin-top:3px; text-shadow: 1px 1px 2px black;}
.track-item button{border:0;background:transparent;color:#fff;padding:7px; font-weight: bold; font-size: 16px;}
.empty{font-size:12px;color:#b1afa6;text-align:center;padding:10px}

@media(min-height:850px){.app{padding-top:28px}.art-wrap{width:min(64vw,310px);margin-top:clamp(60px,12vh,125px)}.track-actions{padding-top:60px}.controls{margin-top:38px}}
@media(max-width:360px){.app{padding-left:18px;padding-right:18px}.art-wrap{width:min(70vw,250px)}.song-title{font-size:26px}.controls .icon-button{padding:6px}.controls .main-play{width:58px;height:58px}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <button class="icon-button" id="collapseBtn" aria-label="Back or collapse player" title="Collapse player">
      <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="menu">
      <button class="icon-button" id="menuBtn" aria-label="More options">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
      </button>
      <div class="menu-pop" id="menuPop">
        <button id="shuffleMenu">Toggle shuffle</button>
        <button id="repeatMenu">Toggle repeat</button>
      </div>
    </div>
  </header>

  <section aria-label="Now playing">
    <div class="art-wrap">
      <div class="art" id="mainArt">
        <img id="coverImage" alt="Current song artwork">
        <svg class="placeholder" id="cakePlaceholder" viewBox="0 0 160 160" aria-label="Birthday cake artwork">
          <path d="M80 23c-13-18-32-1-22 10 7 8 22 18 22 18s15-10 22-18c10-11-9-28-22-10Z" stroke="#d7b56d"/>
          <path d="M48 74V56m32 18V53m32 21V56" />
          <path d="M43 53c-8-7-8-13-2-19m34 19c-8-7-8-13-2-19m34 19c-8-7-8-13-2-19" stroke="#d7b56d"/>
          <path d="M28 82h104v42c0 8-7 12-14 12H42c-7 0-14-4-14-12V82Z"/>
          <path d="M28 91c12-10 20 10 32 0s20 10 32 0 20 10 40 0"/>
          <path d="M18 137h124c0 11-10 15-22 15H40c-12 0-22-4-22-15Z"/>
        </svg>
      </div>
    </div>
    <p class="birthday-tag" id="tagline">Today’s Birthday</p>
    <h1 class="song-title" id="songTitle">Happy Birthday</h1>
    <p class="song-subtitle" id="songSubtitle">Birthday Special</p>
  </section>

  <section class="track-actions" aria-label="Song actions">
    <button class="icon-button" style="visibility:hidden;">
      <svg viewBox="0 0 24 24"></svg>
    </button>
    <button class="icon-button" id="favoriteBtn" title="Favorite" aria-label="Favorite">
      <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>
    </button>
    <button class="icon-button" id="showQueue" title="Song list" aria-label="Song list">
      <svg viewBox="0 0 24 24"><path d="M4 6h13M4 11h13M4 16h8"/><path d="M16 15v5a2 2 0 1 0 2-2h-2V8l5-1v9"/></svg>
    </button>
  </section>

  <section class="progress-area" aria-label="Playback progress">
    <input class="progress" type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek song">
    <div class="times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
  </section>

  <nav class="controls" aria-label="Player controls">
    <button class="icon-button" id="shuffleBtn" title="Shuffle" aria-label="Shuffle">
      <svg viewBox="0 0 24 24"><path d="m3 7 3 0c5 0 7 10 12 10h3"/><path d="m18 14 3 3-3 3"/><path d="M3 17h3c2 0 3.5-2 5-4"/><path d="M14 7h7"/><path d="m18 4 3 3-3 3"/></svg>
    </button>
    <button class="icon-button" id="prevBtn" title="Previous song" aria-label="Previous song">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5h2v14H5zM20 5 8 12l12 7z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="main-play" id="playBtn" title="Play" aria-label="Play">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7Z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="icon-button" id="nextBtn" title="Next song" aria-label="Next song">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 5h2v14h-2zM4 5l12 7-12 7z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="icon-button" id="repeatBtn" title="Repeat off" aria-label="Repeat">
      <svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
    </button>
  </nav>

  <section class="queue" id="queueSection" aria-label="Playlist">
    <div class="queue-head"><span>Dipali's Birthday Playlist</span></div>
    <div class="track-list" id="trackList"></div>
  </section>

  <audio id="audio" preload="metadata"></audio>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const audio = $('audio');
  
  /* Relative paths meant for hosting alongside the files on GitHub Pages */
  const tracks = [
    {
      title: "Happy Birthday My Love",
      subtitle: "To the most special person in my life",
      person: "Dipali ❤️",
      audio: "song1.mp3",
      image: "https://drive.google.com/thumbnail?id=1k0C18x7nJMN5QaTN0InU3xkDSTaR4c9u&sz=w800",
      favorite: true
    },
    {
      title: "You Make My World Beautiful",
      subtitle: "A little birthday song for my favorite person",
      person: "My Dipali 💕",
      audio: "song2.mp3",
      image: "https://drive.google.com/thumbnail?id=1JME_okEZhZerE7UQVc602BM9XPnAQpSr&sz=w800",
      favorite: false
    },
    {
      title: "Forever With You",
      subtitle: "Grateful to have you in my life",
      person: "Dipali ✨",
      audio: "song3.mp3",
      image: "https://drive.google.com/thumbnail?id=1KxS5pM9zS_53gE_M1MREerHlvYPolhhE&sz=w800",
      favorite: false
    },
    {
      title: "Happy Birthday, Beautiful",
      subtitle: "With all my love ❤️",
      person: "Birthday Girl Dipali 🎂",
      audio: "song4.mp3",
      image: "https://drive.google.com/thumbnail?id=1c096a_ZrX5MdMU2_FfGFse_Z7OB6QqhH&sz=w800",
      favorite: false
    },
    {
      title: "A Song Just For You",
      subtitle: "Because you deserve the best birthday ever",
      person: "My Love Dipali 🫶",
      audio: "song5.mp3",
      image: "https://drive.google.com/thumbnail?id=1wS4CWMnxnkFXS4CNcQKjWa-E-ABQdSxE&sz=w800",
      favorite: false
    }
  ];

  let current = -1;
  let isPlaying = false;
  let shuffle = false;
  let repeat = false;

  const icons = {
    pause: '<path d="M8 5v14M16 5v14"/>',
    play: '<path d="M8 5v14l11-7Z" fill="currentColor" stroke="none"/>'
  };
  
  const time = seconds => {
    if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
    return `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2,'0')}`;
  };
  
  function updateProgress() {
    const duration = audio.duration || 0;
    const pct = duration ? (audio.currentTime / duration) * 100 : 0;
    $('seek').value = Math.round(pct * 10);
    $('seek').style.setProperty('--progress', `${pct}%`);
    $('currentTime').textContent = time(audio.currentTime);
    $('duration').textContent = time(duration);
  }
  
  function updatePlayButton() {
    $('playIcon').innerHTML = isPlaying ? icons.pause : icons.play;
    $('playBtn').setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
    $('playBtn').title = isPlaying ? 'Pause' : 'Play';
  }
  
  function render() {
    $('trackList').innerHTML = '';
    tracks.forEach((track, i) => {
      const item = document.createElement('div');
      item.className = `track-item ${i === current ? 'current' : ''}`;
      
      const img = document.createElement('img');
      img.className = 'thumb'; img.alt = ''; img.src = track.image || '';
      img.onerror = () => { img.style.display = 'none'; };
      
      const meta = document.createElement('div'); meta.className = 'track-meta';
      const title = document.createElement('strong'); title.textContent = track.title;
      const sub = document.createElement('span'); sub.textContent = track.subtitle || 'Birthday Special';
      meta.append(title, sub);
      
      const play = document.createElement('button'); 
      play.type = 'button'; 
      play.textContent = i === current && isPlaying ? 'Ⅱ' : '▶'; 
      play.title = 'Play this song';
      play.addEventListener('click', () => i === current ? togglePlay() : loadTrack(i, true));
      
      item.append(img, meta, play); 
      $('trackList').append(item);
    });
  }
  
  function loadTrack(index, autoplay=false) {
    if (!tracks.length) return;
    current = (index + tracks.length) % tracks.length;
    const t = tracks[current];
    audio.src = t.audio;
    $('songTitle').textContent = t.title;
    $('songSubtitle').textContent = t.subtitle || 'Birthday Special';
    $('tagline').textContent = t.person ? `${t.person} · Today’s Birthday` : 'Today’s Birthday';
    $('coverImage').classList.remove('visible');
    
    if (t.image) {
      $('coverImage').src = t.image;
      $('coverImage').onload = () => {
         $('coverImage').classList.add('visible');
         $('cakePlaceholder').style.display = 'none';
      };
      $('coverImage').onerror = () => { 
         $('coverImage').classList.remove('visible'); 
         $('cakePlaceholder').style.display = 'block'; 
      };
    } else {
      $('coverImage').removeAttribute('src');
      $('cakePlaceholder').style.display = 'block';
    }
    
    $('favoriteBtn').classList.toggle('active', !!t.favorite);
    updateProgress(); 
    updatePlayButton(); 
    render();
    if (autoplay) playAudio();
  }
  
  async function playAudio() {
    if (current < 0) loadTrack(0);
    try { 
      await audio.play(); 
      isPlaying = true; 
    } catch (err) { 
      isPlaying = false; 
      if (err.name === 'NotAllowedError') {
          // Normal autoplay block, user just needs to click play
      } else {
          console.error("Audio playback error:", err);
          alert("Error playing audio. Ensure song files are uploaded correctly to GitHub and named exactly song1.mp3, song2.mp3, etc.");
      }
    }
    updatePlayButton(); 
    render();
  }
  
  function pauseAudio() { audio.pause(); isPlaying = false; updatePlayButton(); render(); }
  function togglePlay() { if (isPlaying) pauseAudio(); else playAudio(); }
  
  function nextTrack() {
    if (!tracks.length) return;
    if (shuffle && tracks.length > 1) {
      let next; do { next = Math.floor(Math.random() * tracks.length); } while (next === current);
      loadTrack(next, true);
    } else loadTrack((current + 1) % tracks.length, true);
  }
  
  function previousTrack() {
    if (!tracks.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    loadTrack((current - 1 + tracks.length) % tracks.length, true);
  }

  $('playBtn').addEventListener('click', togglePlay);
  $('nextBtn').addEventListener('click', nextTrack);
  $('prevBtn').addEventListener('click', previousTrack);
  
  $('seek').addEventListener('input', () => {
    const duration = audio.duration || 0;
    if (duration) audio.currentTime = (Number($('seek').value) / 1000) * duration;
  });
  
  $('favoriteBtn').addEventListener('click', () => {
    if (current < 0) return;
    tracks[current].favorite = !tracks[current].favorite;
    $('favoriteBtn').classList.toggle('active', tracks[current].favorite);
  });
  
  $('shuffleBtn').addEventListener('click', () => { shuffle = !shuffle; $('shuffleBtn').classList.toggle('active', shuffle); $('shuffleBtn').title = shuffle ? 'Shuffle on' : 'Shuffle'; });
  $('repeatBtn').addEventListener('click', () => { repeat = !repeat; $('repeatBtn').classList.toggle('active', repeat); $('repeatBtn').title = repeat ? 'Repeat on' : 'Repeat off'; });
  $('shuffleMenu').addEventListener('click', () => $('shuffleBtn').click());
  $('repeatMenu').addEventListener('click', () => $('repeatBtn').click());
  $('menuBtn').addEventListener('click', () => $('menuPop').classList.toggle('open'));
  $('showQueue').addEventListener('click', () => $('queueSection').scrollIntoView({behavior:'smooth',block:'start'}));
  $('collapseBtn').addEventListener('click', () => { document.querySelector('.art-wrap').scrollIntoView({behavior:'smooth',block:'center'}); });
  
  audio.addEventListener('timeupdate', updateProgress);
  audio.addEventListener('loadedmetadata', updateProgress);
  audio.addEventListener('play', () => { isPlaying=true; updatePlayButton(); render(); });
  audio.addEventListener('pause', () => { isPlaying=false; update play buttons(); render(); });
  audio.addEventListener('ended', () => { if (repeat) { audio.currentTime=0; playAudio(); } else nextTrack(); });
  
  audio.addEventListener('error', () => { 
    if (audio.src) { 
        isPlaying=false; 
        updatePlayButton(); 
    } 
  });
  
  document.addEventListener('click', e => { if (!e.target.closest('.menu')) $('menuPop').classList.remove('open'); });
  
  // Initialize first track without attempting autoplay
  loadTrack(0);
})();
</script>
</body>
</html>
